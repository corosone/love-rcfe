<!doctype html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Staff Inbox | Love RCFE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23315d48'/%3E%3Cpath d='M16 24s-7-4.6-7-10a4 4 0 0 1 7-2.4A4 4 0 0 1 23 14c0 5.4-7 10-7 10z' fill='%23dce7d9'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              ink: '#26382f',
              muted: '#59685f',
              cream: '#f8f5ee',
              creamLight: '#fcfbfa',
              sage: '#dce7d9',
              sageLight: '#edf2e9',
              green: '#315d48',
              greenDark: '#203d30',
              accent: '#a96b46',
              accentLight: '#f5eee5',
              line: '#d9ded4'
            }
          },
          fontFamily: {
            sans: ['"DM Sans"', 'sans-serif'],
            display: ['"Fraunces"', 'serif']
          }
        }
      }
    };
  </script>
  <script>
    (function() {
      try {
        var isDark = localStorage.getItem('lovercfe_theme') === 'dark';
        if (isDark) document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
  <style>
    body { font-family: 'DM Sans', sans-serif; }
    .display { font-family: 'Fraunces', serif; }
    html.dark body { background-color: #121915; color: #e6ede8; }
    html.dark .surface { background-color: #1a251f !important; border-color: #2d4034 !important; }
    html.dark .surface-soft { background-color: #151e19 !important; border-color: #2d4034 !important; }
    html.dark .text-brand-ink { color: #e6ede8 !important; }
    html.dark .text-brand-muted { color: #a7b8ad !important; }
    html.dark .text-brand-green { color: #4ade80 !important; }
    html.dark .border-brand-line { border-color: #2d4034 !important; }
    html.dark input { background-color: #121915 !important; color: #e6ede8 !important; border-color: #2d4034 !important; }
  </style>
</head>
<body class="bg-brand-cream text-brand-ink min-h-screen flex flex-col antialiased">
  <header class="surface bg-white border-b border-brand-line sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <a href="/" class="w-9 h-9 rounded-xl bg-brand-green text-white flex items-center justify-center shrink-0" title="Back to Love RCFE website">
          <i data-lucide="heart-handshake" class="w-5 h-5"></i>
        </a>
        <div>
          <h1 class="display text-lg font-bold leading-tight text-brand-ink">Love RCFE Staff Inbox</h1>
          <p class="text-[11px] text-brand-muted">Private PostgreSQL Leads Dashboard</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button id="theme-btn" type="button" onclick="toggleTheme()" class="p-2 rounded-full border border-brand-line text-brand-ink hover:bg-brand-sageLight/40 transition" aria-label="Toggle dark mode">
          <i data-lucide="moon" class="w-4 h-4"></i>
        </button>
        <a href="/" class="px-3.5 py-1.5 rounded-full border border-brand-line text-xs font-semibold text-brand-ink hover:bg-brand-sageLight/40 transition">
          Public Site
        </a>
        <button id="signout-btn" type="button" onclick="signOut()" class="hidden px-3.5 py-1.5 rounded-full border border-brand-line text-xs font-semibold text-brand-muted hover:text-brand-ink transition">
          Sign Out
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-8">
    <!-- Login View -->
    <section id="login-view" class="max-w-md mx-auto mt-8 surface bg-white rounded-3xl border border-brand-line shadow-lg p-7 sm:p-8">
      <div class="w-11 h-11 rounded-2xl bg-brand-sageLight text-brand-green flex items-center justify-center mb-4">
        <i data-lucide="lock" class="w-5 h-5"></i>
      </div>
      <h2 class="display text-2xl font-semibold text-brand-ink mb-1">Staff Sign In</h2>
      <p class="text-sm text-brand-muted mb-6">Enter your <code class="text-xs px-1.5 py-0.5 rounded bg-brand-sageLight/60 text-brand-ink">INBOX_PASSWORD</code> to view enquiries and call requests stored in the database.</p>

      <form id="login-form" class="space-y-4">
        <div>
          <label for="inbox-password" class="block text-xs font-bold uppercase tracking-wider text-brand-ink mb-1.5">Inbox Password</label>
          <input id="inbox-password" type="password" autocomplete="current-password" required placeholder="Enter staff password" class="w-full px-4 py-3 rounded-xl border border-brand-line text-sm focus:outline-none focus:ring-2 focus:ring-brand-green">
        </div>
        <button id="login-submit" type="submit" class="w-full rounded-full bg-brand-green text-white py-3 font-bold text-sm hover:bg-brand-greenDark transition shadow-sm disabled:opacity-60">
          Open Staff Inbox
        </button>
        <p id="login-error" role="status" class="text-xs font-semibold text-red-600 dark:text-red-400 min-h-4"></p>
      </form>
    </section>

    <!-- Dashboard View -->
    <section id="dashboard-view" class="hidden space-y-6">
      <!-- Stats Row -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">
        <div class="surface bg-white p-4 rounded-2xl border border-brand-line">
          <p class="text-xs font-semibold text-brand-muted">Open Leads</p>
          <p id="stat-open" class="display text-2xl font-bold text-brand-green mt-1">0</p>
        </div>
        <div class="surface bg-white p-4 rounded-2xl border border-brand-line">
          <p class="text-xs font-semibold text-brand-muted">Call Requests</p>
          <p id="stat-calls" class="display text-2xl font-bold text-brand-accent mt-1">0</p>
        </div>
        <div class="surface bg-white p-4 rounded-2xl border border-brand-line">
          <p class="text-xs font-semibold text-brand-muted">Handled</p>
          <p id="stat-handled" class="display text-2xl font-bold text-brand-ink mt-1">0</p>
        </div>
        <div class="surface bg-white p-4 rounded-2xl border border-brand-line">
          <p class="text-xs font-semibold text-brand-muted">Total Stored</p>
          <p id="stat-total" class="display text-2xl font-bold text-brand-ink mt-1">0</p>
        </div>
      </div>

      <!-- Toolbar -->
      <div class="surface bg-white p-4 rounded-2xl border border-brand-line flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div class="flex flex-wrap items-center gap-1.5" role="group" aria-label="Filter leads">
          <button type="button" data-filter="open" class="filter-btn px-3.5 py-1.5 rounded-full text-xs font-bold transition">Open</button>
          <button type="button" data-filter="calls" class="filter-btn px-3.5 py-1.5 rounded-full text-xs font-bold transition">Call Requests</button>
          <button type="button" data-filter="handled" class="filter-btn px-3.5 py-1.5 rounded-full text-xs font-bold transition">Handled</button>
          <button type="button" data-filter="all" class="filter-btn px-3.5 py-1.5 rounded-full text-xs font-bold transition">All</button>
        </div>

        <div class="flex flex-wrap items-center gap-2">
          <input id="search-input" type="search" placeholder="Search name, phone, city..." class="px-3.5 py-1.5 rounded-full border border-brand-line text-xs w-full sm:w-52 focus:outline-none focus:ring-2 focus:ring-brand-green">
          <button type="button" onclick="loadLeads()" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full border border-brand-line text-xs font-bold text-brand-ink hover:bg-brand-sageLight/40 transition">
            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Refresh
          </button>
          <button type="button" onclick="exportCsv()" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-brand-green text-white text-xs font-bold hover:bg-brand-greenDark transition">
            <i data-lucide="download" class="w-3.5 h-3.5"></i> Export CSV
          </button>
        </div>
      </div>

      <p id="dash-status" role="status" class="text-xs font-semibold text-brand-muted min-h-4"></p>

      <!-- Leads List -->
      <div id="leads-list" class="space-y-3"></div>
    </section>
  </main>

  <script>
    const TOKEN_KEY = 'lovercfe_staff_pw';
    let allLeads = [];
    let currentFilter = 'open';
    let searchQuery = '';

    function refreshIcons() {
      if (window.lucide && typeof lucide.createIcons === 'function') lucide.createIcons();
    }

    function toggleTheme() {
      const dark = !document.documentElement.classList.contains('dark');
      document.documentElement.classList.toggle('dark', dark);
      try { localStorage.setItem('lovercfe_theme', dark ? 'dark' : 'light'); } catch (e) {}
      const btn = document.getElementById('theme-btn');
      if (btn) {
        btn.innerHTML = dark ? '<i data-lucide="sun" class="w-4 h-4"></i>' : '<i data-lucide="moon" class="w-4 h-4"></i>';
        refreshIcons();
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    async function apiFetch(url, options = {}) {
      const pw = sessionStorage.getItem(TOKEN_KEY) || '';
      const res = await fetch(url, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + pw,
          ...(options.headers || {})
        }
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw Object.assign(new Error(data.error || 'Request failed'), { status: res.status });
      }
      return data;
    }

    function showLogin(errorMsg = '') {
      document.getElementById('login-view').classList.remove('hidden');
      document.getElementById('dashboard-view').classList.add('hidden');
      document.getElementById('signout-btn').classList.add('hidden');
      document.getElementById('login-error').textContent = errorMsg;
    }

    function showDashboard() {
      document.getElementById('login-view').classList.add('hidden');
      document.getElementById('dashboard-view').classList.remove('hidden');
      document.getElementById('signout-btn').classList.remove('hidden');
      document.getElementById('login-error').textContent = '';
    }

    function signOut() {
      sessionStorage.removeItem(TOKEN_KEY);
      allLeads = [];
      document.getElementById('inbox-password').value = '';
      showLogin('');
    }

    async function loadLeads() {
      const statusEl = document.getElementById('dash-status');
      if (statusEl) statusEl.textContent = 'Loading leads from database...';
      try {
        const data = await apiFetch('/api/admin/leads');
        allLeads = Array.isArray(data.leads) ? data.leads : [];
        showDashboard();
        if (statusEl) statusEl.textContent = `Showing latest records (${allLeads.length} loaded).`;
        renderLeads();
      } catch (err) {
        if (err.status === 401) {
          sessionStorage.removeItem(TOKEN_KEY);
          showLogin(err.message);
        } else if (err.status === 503) {
          showLogin(err.message);
        } else {
          if (statusEl) statusEl.textContent = err.message;
        }
      }
    }

    async function setHandled(id, handled) {
      try {
        await apiFetch('/api/admin/leads', {
          method: 'PATCH',
          body: JSON.stringify({ id, handled })
        });
        const target = allLeads.find(l => Number(l.id) === Number(id));
        if (target) target.handled = handled;
        renderLeads();
      } catch (err) {
        alert(err.message);
      }
    }

    async function deleteLead(id) {
      if (!confirm('Permanently delete this lead from the database?')) return;
      try {
        await apiFetch(`/api/admin/leads?id=${encodeURIComponent(id)}`, { method: 'DELETE' });
        allLeads = allLeads.filter(l => Number(l.id) !== Number(id));
        renderLeads();
      } catch (err) {
        alert(err.message);
      }
    }

    function renderLeads() {
      const openCount = allLeads.filter(l => !l.handled).length;
      const handledCount = allLeads.filter(l => l.handled).length;
      const callsCount = allLeads.filter(l => l.kind === 'call_request' && !l.handled).length;

      document.getElementById('stat-open').textContent = openCount;
      document.getElementById('stat-calls').textContent = callsCount;
      document.getElementById('stat-handled').textContent = handledCount;
      document.getElementById('stat-total').textContent = allLeads.length;

      document.querySelectorAll('.filter-btn').forEach(btn => {
        const active = btn.dataset.filter === currentFilter;
        btn.className = active
          ? 'filter-btn px-3.5 py-1.5 rounded-full text-xs font-bold transition bg-brand-green text-white'
          : 'filter-btn px-3.5 py-1.5 rounded-full text-xs font-bold transition text-brand-ink hover:bg-brand-sageLight/40';
      });

      const q = searchQuery.toLowerCase();
      const filtered = allLeads.filter(l => {
        if (currentFilter === 'open' && l.handled) return false;
        if (currentFilter === 'handled' && !l.handled) return false;
        if (currentFilter === 'calls' && l.kind !== 'call_request') return false;
        if (!q) return true;
        return [l.name, l.email, l.phone, l.city, l.inquiryType, l.message]
          .some(v => String(v || '').toLowerCase().includes(q));
      });

      const listEl = document.getElementById('leads-list');
      if (!filtered.length) {
        listEl.innerHTML = `
          <div class="surface bg-white rounded-2xl border border-brand-line p-10 text-center">
            <i data-lucide="inbox" class="w-8 h-8 mx-auto text-brand-muted mb-2 opacity-60"></i>
            <p class="text-sm font-bold text-brand-ink">No matching leads</p>
            <p class="text-xs text-brand-muted mt-1">Try switching filter tabs or clearing the search bar.</p>
          </div>
        `;
        refreshIcons();
        return;
      }

      listEl.innerHTML = filtered.map(l => {
        const isCall = l.kind === 'call_request';
        const created = new Date(l.createdAt).toLocaleString('en-US', {
          month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit'
        });
        const telHref = 'tel:' + encodeURIComponent(String(l.phone || '').replace(/[^+\d]/g, ''));
        const mailHref = 'mailto:' + encodeURIComponent(String(l.email || ''));
        return `
          <article class="surface bg-white rounded-2xl border border-brand-line p-5 shadow-sm space-y-3 ${l.handled ? 'opacity-75' : ''}">
            <div class="flex flex-wrap items-start justify-between gap-3">
              <div>
                <div class="flex flex-wrap items-center gap-2">
                  <h3 class="text-base font-bold text-brand-ink">${escapeHtml(l.name)}</h3>
                  <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full ${isCall ? 'bg-amber-100 text-amber-900 dark:bg-amber-950/60 dark:text-amber-300' : 'bg-emerald-100 text-emerald-900 dark:bg-emerald-950/60 dark:text-emerald-300'}">
                    ${isCall ? 'Scheduled Call' : 'Enquiry'}
                  </span>
                  <span class="text-[11px] font-semibold px-2.5 py-0.5 rounded-full border border-brand-line text-brand-muted">
                    ${escapeHtml(l.inquiryType)}
                  </span>
                  ${l.handled ? '<span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-brand-sageLight text-brand-green">Handled</span>' : ''}
                </div>
                <div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-brand-muted mt-1.5">
                  <a href="${telHref}" class="hover:underline font-semibold text-brand-green flex items-center gap-1">
                    <i data-lucide="phone" class="w-3.5 h-3.5"></i> ${escapeHtml(l.phone)}
                  </a>
                  <a href="${mailHref}" class="hover:underline flex items-center gap-1">
                    <i data-lucide="mail" class="w-3.5 h-3.5"></i> ${escapeHtml(l.email)}
                  </a>
                  ${l.city ? `<span class="flex items-center gap-1"><i data-lucide="map-pin" class="w-3.5 h-3.5"></i> ${escapeHtml(l.city)}</span>` : ''}
                  ${l.preferredDate ? `<span class="flex items-center gap-1 font-semibold text-brand-ink"><i data-lucide="calendar" class="w-3.5 h-3.5"></i> ${escapeHtml(l.preferredDate)} (${escapeHtml(l.preferredTime || '')})</span>` : ''}
                </div>
              </div>
              <span class="text-[11px] text-brand-muted">${escapeHtml(created)}</span>
            </div>

            <div class="surface-soft bg-brand-cream/70 rounded-xl border border-brand-line p-3.5 text-sm text-brand-ink whitespace-pre-line leading-relaxed">${escapeHtml(l.message)}</div>

            <div class="flex items-center justify-end gap-3 pt-1">
              <button type="button" onclick="deleteLead(${Number(l.id)})" class="text-xs font-semibold text-red-600 dark:text-red-400 hover:underline">
                Delete
              </button>
              <button type="button" onclick="setHandled(${Number(l.id)}, ${!l.handled})" class="px-4 py-1.5 rounded-full text-xs font-bold transition ${l.handled ? 'border border-brand-line text-brand-ink hover:bg-brand-sageLight/40' : 'bg-brand-green text-white hover:bg-brand-greenDark'}">
                ${l.handled ? 'Reopen' : 'Mark Handled'}
              </button>
            </div>
          </article>
        `;
      }).join('');
      refreshIcons();
    }

    function csvCell(value) {
      let s = String(value == null ? '' : value);
      if (/^[=@]/.test(s) || /^[+\-][^\d\s(]/.test(s)) s = "'" + s;
      return '"' + s.replace(/"/g, '""') + '"';
    }

    function exportCsv() {
      if (!allLeads.length) return alert('No leads to export.');
      const headers = ['ID', 'Kind', 'Inquiry Type', 'Name', 'Phone', 'Email', 'City', 'Preferred Date', 'Preferred Time', 'Handled', 'Message', 'Created At'];
      const rows = allLeads.map(l => [
        l.id, l.kind, l.inquiryType, l.name, l.phone, l.email, l.city,
        l.preferredDate || '', l.preferredTime || '', l.handled ? 'Yes' : 'No',
        l.message, l.createdAt
      ].map(csvCell).join(','));
      const csv = '\ufeff' + [headers.join(','), ...rows].join('\r\n');
      const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
      const a = document.createElement('a');
      a.href = url;
      a.download = `lovercfe_leads_${new Date().toISOString().split('T')[0]}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = document.getElementById('inbox-password').value;
      const btn = document.getElementById('login-submit');
      btn.disabled = true;
      sessionStorage.setItem(TOKEN_KEY, pw);
      await loadLeads();
      btn.disabled = false;
    });

    document.addEventListener('click', (e) => {
      const btn = e.target.closest && e.target.closest('[data-filter]');
      if (btn) {
        currentFilter = btn.dataset.filter;
        renderLeads();
      }
    });

    document.getElementById('search-input').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderLeads();
    });

    if (document.documentElement.classList.contains('dark')) {
      const btn = document.getElementById('theme-btn');
      if (btn) btn.innerHTML = '<i data-lucide="sun" class="w-4 h-4"></i>';
    }
    refreshIcons();

    if (sessionStorage.getItem(TOKEN_KEY)) {
      loadLeads();
    }
  </script>
</body>
</html>
