# Runs the automated tests in /tests on every push, on GitHub's computers (free for public
# repositories). A red cross on a commit or pull request means a test failed: do not merge.
name: Tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Each outside action is pinned to an exact version (its commit fingerprint), so a change
      # to it cannot slip into this repository unnoticed. The version is in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      # npm ci installs exactly the versions in package-lock.json (as Cloudflare does).
      - name: Build the site (the same step Cloudflare runs)
        run: npm ci --no-audit --no-fund && npm run build
      - name: Install the test tools
        working-directory: tests
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Run the tests
        working-directory: tests
        run: npm test
