# Asks the site to email the weekly summary to the owner, every Monday morning (Pacific).
#
# Cloudflare Pages cannot run on a timer, so GitHub does the timing. Nothing needs to be
# set up: the site itself makes sure that it only sends on Mondays (California time), at most
# one summary every 5 days, and only ever to the owner (see functions/api/cron/weekly-summary.js).
#
# The email itself is never shown here. This log is public, so it only shows whether the
# site answered "sent".
#
# To send one by hand on a Monday: Actions tab > Weekly summary email > Run workflow.
# (On other days, or if one was already sent in the last 5 days, the site answers "not sent"
# and that is fine.) GitHub pauses scheduled workflows after 60 days without changes; the daily
# site check (site-check.yml) switches this one back on every day so that never happens.
name: Weekly summary email

on:
  schedule:
    - cron: '23 16 * * 1' # Mondays 16:23 UTC (8:23 am Pacific in winter, 9:23 am in summer)
  workflow_dispatch:

permissions: {}

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the site to send the summary
        run: |
          status=$(curl -sS -o reply.json -w '%{http_code}' --max-time 60 -X POST \
            https://love-rcfe.pages.dev/api/cron/weekly-summary)
          echo "The site answered with status $status: $(cat reply.json)"
          if [ "$status" != "200" ]; then
            echo "200 = fine (sent, already sent in the last 5 days, or not a Monday in California). 502 = the email service refused. 429 = asked too often."
            exit 1
          fi
